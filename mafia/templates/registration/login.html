{% extends "base.html" %}

{% block title %}Вход — {{ block.super }}{% endblock %}

{% block content %}
  <div class="auth-card">
  <h1 class="h3 mb-4">Вход</h1>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field.errors }}
        <input
          type="{% if 'password' in field.name %}password{% else %}text{% endif %}"
          name="{{ field.name }}"
          id="{{ field.id_for_label }}"
          class="form-control{% if field.errors %} is-invalid{% endif %}"
          {% if field.field.required %}required{% endif %}
          {% if field.name == 'username' %}autofocus{% endif %}
          value="{{ field.value|default:'' }}"
        >
      </div>
    {% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary w-100">Войти</button>
  </form>
  <p class="mt-3 mb-0 text-center"><a href="{% url 'register' %}">Регистрация</a></p>
  </div>
{% endblock %}
