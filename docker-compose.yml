services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mafia_db
      POSTGRES_USER: mafia
      POSTGRES_PASSWORD: mafia_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata_mafia:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafia -d mafia_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata_mafia:
